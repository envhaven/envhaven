name: Audit

# Known-vulnerability checks for every dependency tree in this repository: the five bun lockfiles
# and the console's Go module, with the toolchain it ships. Advisories are published against code
# that has not changed, so this also runs weekly, and on any push that changes a dependency. It
# stays out of ci.yml on purpose: docker.yml calls ci.yml, and an advisory published the morning
# of a release should be fixed or accepted here, in the open, rather than surfacing as a failed
# release.
#
# GitHub's dependency graph does not read bun.lock, so Dependabot raises no alert for any of these
# packages. The weekly run is the monitor; its failure notification is the alert.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - '**/package.json'
      - '**/bun.lock'
      - 'console/go.mod'
      - 'console/go.sum'
      - 'Dockerfile'
      - '.github/workflows/audit.yml'
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  group: audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# A read-only token. Actions are pinned to a full commit SHA, with the release tag beside each pin
# for Dependabot to keep in step, and checkouts leave no token in .git/config.
permissions:
  contents: read

jobs:
  bun:
    name: Bun (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: cli
          - directory: dev
          - directory: extension
          - directory: extension/webview
          - directory: skills/use-whatsapp/templates
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      # bun audit reads bun.lock and asks the npm advisory endpoint about it, so nothing is
      # installed and no dependency code runs. High and critical fail the job. The fourth pass
      # upgraded vsce and its tree, so the former braces exception is gone.
      - name: Audit
        working-directory: ${{ matrix.directory }}
        run: bun audit --audit-level=high

  go:
    name: Go (console)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The standard library that ships is the one in the Dockerfile's console-builder stage, whose
      # golang image is pinned by digest, not the runner's newest Go. Building that stage alone
      # gives govulncheck the shipped toolchain, go.mod and downloaded modules, with no second copy
      # of the Go version to keep in step.
      - name: Build the console builder stage
        run: docker build --target console-builder --tag envhaven-console-builder .

      # govulncheck follows the call graph, so it fails only when the console can reach vulnerable
      # code, standard library included; a vulnerability in a package the console never calls is
      # listed and passes. Fetched by exact version through the Go module proxy and checked against
      # sum.golang.org, the same way go.mod's own dependencies are. CGO_ENABLED=0 matches the build.
      - name: Govulncheck
        run: docker run --rm --env CGO_ENABLED=0 envhaven-console-builder go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
