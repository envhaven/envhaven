name: Docker

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

concurrency:
  group: docker-${{ github.ref }}
  # Never cancel a release. Master pushes still coalesce, because only the newest of
  # those is worth an image, but a half-published tag is worse than a slow one.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Nothing reaches ghcr until CI is green. One workflow cannot `needs:` another, so the
  # checks are called in as a job here and `needs: checks` below waits on the whole of
  # ci.yml, every job in it. Called workflows run under THIS workflow's ref and event, so
  # on a v* tag they check the tagged tree, which is the tree being published.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # One platform, so this pushes tags directly. It used to build by digest into a
  # matrix and hand those digests to a `merge` job that fused them into a manifest
  # list — the right shape for several platforms, and dead weight for one. Worse, the
  # tags only ever came from `merge`, which was tag-gated, so every master push left an
  # untagged blob in ghcr that nothing referenced. Adding linux/arm64 means bringing
  # that machinery back, not editing this job: the image also installs an x86_64-pinned
  # docker binary (Dockerfile:83) that needs an arch case first.
  build:
    name: Build
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ahead of metadata-action so the version label can read it. This is the single
      # place that decides what version the image calls itself; both consumers below take
      # it from here, the OCI label and the ENVHAVEN_VERSION build-arg.
      #
      # Deliberately not steps.meta.outputs.version, and the difference is load-bearing.
      # That output strips the v (1.7.4), while GitHub releases are v1.7.4 and every
      # workspace already running reports ENVHAVEN_VERSION=v1.7.4. The VM updater compares
      # the two by plain string equality, so a v-less label makes every workspace believe
      # it is permanently out of date. On master that output is literally `dev`, which
      # would give every commit the same version.
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver types only fire on a tag push. `dev` is what stops master pushes going
          # out untagged, and it is deliberately a single moving tag rather than one per
          # commit: it always means "current master" and never accumulates.
          # `latest` needs no entry of its own: flavor defaults to latest=auto, which
          # emits it for a non-prerelease semver tag and for nothing else. Spelling it out
          # as a raw tag published it twice, and published it for prereleases and for `v*`
          # tags that are not semver at all.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/master' }}
          # Registry tags stay v-less (1.7.4); the version label keeps the v. A custom
          # label is merged last and wins on its key, so this replaces the generated value
          # rather than adding a second one.
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            ENVHAVEN_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          # build-push-action attests by default (mode=max on public repos), which wraps a
          # single-platform build in an index whose children are untagged. That makes
          # "untagged" mean two different things in the registry — superseded junk, and the
          # live manifest a published tag resolves through — so no simple prune can be
          # correct. One platform, one manifest, one meaning.
          provenance: false
          # Shared with ci.yml's image job, which builds this same tree first. Bumping
          # the -v2 suffix means bumping it there too, or the two silently stop sharing.
          cache-from: type=gha,scope=linux/amd64-v2
          cache-to: type=gha,mode=max,scope=linux/amd64-v2

      # Every tag that was just pushed, so a release which published nothing pullable
      # fails here rather than at someone's `docker pull`. Via env because the expression
      # is newline-delimited and would break the `for` if pasted into the script body;
      # unquoted $TAGS is what splits it back into words.
      #
      # The emptiness guard keeps the step self-contained. buildx would already have
      # failed the build with "tag is needed when pushing to registry", so this is not the
      # only thing standing between an empty tag list and a green release — but without it
      # a `for` over an empty $TAGS runs zero times and reports ok, which is the one
      # outcome a verification step must never produce on its own.
      - name: Inspect pushed tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$TAGS" ]; then
            echo "metadata-action generated no tags for ${{ github.ref }}" >&2
            exit 1
          fi
          for tag in $TAGS; do
            docker buildx imagetools inspect "$tag" > /dev/null
            echo "ok: $tag"
          done
