name: CI

on:
  pull_request:
    branches:
      - master
  # Callable, so the release path runs these same checks instead of its own copy.
  # docker.yml gates its build on this file: one workflow cannot `needs:` another, it
  # can only call it, and calling is what stops a bad image before it reaches ghcr.
  workflow_call:

concurrency:
  # head_ref is empty on anything but a pull request. This file now also runs as a called
  # workflow on pushes and tags, where a bare `ci-${{ github.head_ref }}` would put every
  # one of them in the same unnamed bucket.
  group: ci-${{ github.head_ref || github.ref }}
  # Only pull request runs are worth superseding. On the called path the caller decides
  # anyway, since cancelling docker.yml cancels the jobs it called; this keeps the direct
  # pull request behaviour and makes the called case explicit rather than accidental.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: cli

      - name: Lint
        run: bun run lint
        working-directory: cli

      - name: Type check
        run: bun run typecheck
        working-directory: cli

      - name: Test
        run: bun test
        working-directory: cli

  image:
    name: Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: envhaven:test
          # The same scope docker.yml builds into, so on a release this job builds the
          # image and docker.yml's push reuses the layers instead of paying for a second
          # cold build. That only works because ENVHAVEN_VERSION is set at the END of the
          # Dockerfile: it is the one build-arg that differs between the two jobs, and
          # while it sat above the install steps it invalidated all of them.
          # Pinned to linux/amd64 because that is the runner's native platform and this
          # job never sets `platforms`. Bumping the -v2 suffix means bumping it in
          # docker.yml too, or the two silently stop sharing.
          cache-from: type=gha,scope=linux/amd64-v2
          cache-to: type=gha,mode=max,scope=linux/amd64-v2

      # The same harness `eh` runs locally, so a green CI and a green desk mean the same
      # thing. This used to be five inline steps booting six containers behind five
      # guessed sleeps, which had drifted away from the harness in both directions and
      # failed whenever lscr.io was slow enough to push sshd past `sleep 10`. Needs no
      # `bun install`: the script imports only runtime builtins and dev/scripts/lib.
      - name: Test image
        run: bun dev/scripts/test-image.ts
        env:
          ENVHAVEN_IMAGE: envhaven:test

  extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dev dependencies
        run: bun install
        working-directory: dev

      # Three jobs now run dev/scripts directly, so a type error there breaks the pipeline
      # rather than one developer's terminal. This is the only job that installs dev's
      # dependencies, which is what tsc needs, and it is far cheaper than the build below.
      - name: Type check dev scripts
        run: bun run typecheck
        working-directory: dev

      - name: Test extension build
        run: bun dev/scripts/test-extension.ts

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # `stable` keeps CI on a security-supported toolchain with nothing to
          # bump, matching the Dockerfile's console-builder policy. go.mod's
          # `go 1.22` directive is the language minimum, not the toolchain.
          go-version: stable
          cache-dependency-path: console/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The page and its engine are embedded into the binary and served verbatim, and
      # nothing else in this workflow looks inside either: the image job only greps the
      # served page for its <title>. Parse the engine here so a syntax error cannot ship
      # green. Needs no `bun install`, since the script imports only runtime builtins and
      # dev/scripts/lib. Ahead of the Go steps because it is the cheapest check in the job
      # by two orders of magnitude, and a broken terminal should not wait on
      # `go test -race` to be found.
      - name: Terminal page
        run: bun dev/scripts/test-console-ui.ts

      - name: Format
        run: test -z "$(gofmt -l .)"
        working-directory: console

      - name: Vet
        run: go vet ./...
        working-directory: console

      - name: Test
        run: go test -race -count=1 ./...
        working-directory: console
