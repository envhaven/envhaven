<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnvHaven Terminal</title>
<link rel="stylesheet" href="/__console/assets/xterm.css">
<style>
  /* The dashboard's mono font (JetBrains Mono, next/font --font-mono), vendored so the
     terminal matches the cockpit chrome with zero external fetches. Hash-pinned like the
     xterm bundle (TestVendoredAssetsPristine). */
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; font-style: normal;
               src: url('/__console/assets/jetbrains-mono-regular.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; font-style: normal;
               src: url('/__console/assets/jetbrains-mono-bold.woff2') format('woff2'); }
  html, body { height: 100%; margin: 0; background: #1e1e1e; color: #ccc; font-family: system-ui, sans-serif; }
  #term { position: absolute; inset: 0; }
  /* JetBrains Mono ships programming ligatures (-> => != === ...) enabled through
     `calt`, and a ligature fuses two characters into ONE glyph of a different
     advance. A terminal is a grid — one cell, one glyph — and the predictive
     overlay flows its text through the browser's own layout to land on the exact
     pixels xterm will use, so a fused pair shifts the prediction against the row
     beneath it. Both properties inherit, so this one rule covers xterm's rows and
     every overlay layer inside them. */
  #term, #term * { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  /* A terminal is a whole number of character rows, so the grid floors to a sub-row
     remainder (< one line) that no fit removes. Fill the panel with xterm's root and
     center its grid, so the remainder splits evenly top and bottom instead of pooling
     below the last row. The grid is the root's only in-flow child (its viewport sibling
     is absolute), so centering shifts the grid alone — and with it the predictive-echo
     overlay, which lives inside .xterm-screen, so alignment is preserved. xterm.css pins
     that viewport to #000, so clear it and the split shows the themed page background the
     body already carries, not a black band under a light dashboard. */
  #term > div { height: 100%; display: flex; flex-direction: column; justify-content: center; }
  #term .xterm-viewport { background-color: transparent; }
  #term.hide { display: none; }
  #login { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
  #login.show { display: flex; }
  form { background: #252526; padding: 24px; border-radius: 8px; display: flex; flex-direction: column; gap: 12px; min-width: 260px; }
  h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; color: #eee; }
  input { padding: 8px; border-radius: 4px; border: 1px solid #3c3c3c; background: #1e1e1e; color: #eee; font-size: 14px; }
  button { padding: 8px; border: 0; border-radius: 4px; background: #0e639c; color: #fff; font-size: 14px; cursor: pointer; }
  button:hover { background: #1177bb; }
  .err { color: #f48771; font-size: 13px; min-height: 16px; }
  /* Connection status surface. The terminal's scrollback belongs to the user's shell,
     so nothing about OUR transport is ever written into it; when there is no session
     to type into, this says so on top of the terminal instead. It mirrors the
     dashboard's pre-connect loader (same braille mark, glow, name, status line) so an
     embedded console reads as one screen, and adds the one action that helps. Colours
     come from the host theme at runtime, like the terminal's own. */
  #status { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
            background: #1e1e1e; color: #ccc; z-index: 20; }
  #status.show { display: flex; }
  #status .card { display: flex; flex-direction: column; align-items: center; gap: 16px;
                  font-family: 'JetBrains Mono', monospace; }
  /* The mark stacks two glyph layers in ONE grid cell, so both get the same box, font,
     size and line-height and the lifted dot below lands exactly on the dot it replaces.
     Grid rather than an absolute overlay: an absolutely positioned box inside the inline
     .spin resolves its baseline through its own half-leading, which misses the inline
     baseline by a fraction of a pixel. .glow stays absolute and is deliberately left out
     of the cell: its inset: -16px must keep measuring from the mark's padding box. */
  #status .mark { position: relative; line-height: 1; display: grid; }
  #status .mark > .spin, #status .mark > .lift { grid-area: 1 / 1; }
  #status .glow { position: absolute; inset: -16px; border-radius: 999px; background: currentColor;
                  opacity: .10; filter: blur(16px); }
  #status .spin { position: relative; font-size: 24px; line-height: 1; opacity: .8; }
  /* Disconnected, the six dots go dim and one dot at a time lifts a little out of the
     dim, on a beat that never repeats (see stutter()). It has to read as a connection
     that is gone, not as work in progress, so the lift is deliberately small: measured
     off the rendered pixels, a dim dot peaks at .26 alpha of the theme foreground and a
     lifted one at .44, against .80 for the live mark. Both layers mix from the same
     inherited currentColor, so those numbers stay comparable and the host theme still
     owns the hue. .lift is positioned so it paints over .spin instead of under it. */
  #status .spin.dim { color: color-mix(in oklab, currentColor 30%, transparent); }
  #status .lift { position: relative; font-size: 24px; line-height: 1; opacity: 0;
                  color: color-mix(in oklab, currentColor 30%, transparent);
                  transition: opacity .45s ease-in-out; }
  #status .lift.on { opacity: .8; }
  #status .who { font-size: 14px; font-weight: 500; letter-spacing: -0.01em; text-align: center; }
  #status .msg { margin-top: 4px; font-size: 12px; opacity: .6; text-align: center; }
  /* Square, like every control in the cockpit around it: the dashboard's --radius is 0rem and
     the Launch button this one sits beside is a mono, uppercase, 11px rectangle with a tinted
     border, so a dead session still reads as the same product. The tints mix from currentColor
     — the host theme's foreground — because the brand token they use downstairs does not reach
     an iframe. Hover deepens the fill and takes the border to full strength rather than
     flooding it the way Launch does: the label is currentColor too, so a currentColor fill
     would paint it out. Both states carry the same 1px border and box, so the swap to
     `.away` below never moves anything. */
  #status button { height: 28px; padding: 0 12px; font-family: inherit; font-size: 11px;
                   font-weight: 500; text-transform: uppercase; letter-spacing: .025em;
                   border-radius: 0; border: 1px solid color-mix(in oklab, currentColor 30%, transparent);
                   background: color-mix(in oklab, currentColor 6%, transparent); color: inherit;
                   cursor: pointer; transition: background-color .12s, border-color .12s; }
  #status button:hover { border-color: currentColor;
                         background: color-mix(in oklab, currentColor 14%, transparent); }
  /* While a reconnect is in flight the button is not offered, but its space stays
     reserved: removing it from layout would re-centre the card the instant it is
     clicked, moving the text out from under the pointer. visibility (not display)
     also takes it out of the tab order and the a11y tree. */
  #status button.away { visibility: hidden; pointer-events: none; }
  /* While a predicted cursor is shown, neutralize xterm's real cursor DECORATION
     only — background, accent colour, outline, blink — never the cell itself: in
     the DOM renderer the cursor cell contains the character, so opacity/visibility
     would blank every cell the trailing real cursor passes through. The #term id
     is load-bearing: xterm's own non-blinking block rule carries !important behind
     a six-class selector (and the blink class drops during activity, which is
     exactly when the trailing cursor shows), so only an id out-specifies it. */
  /* The neutralised cell must fall back to the background the APPLICATION drew there, not
     to nothing: this !important also outranks the cell's own .xterm-bg-N, so a plain
     `transparent` punches a one-cell hole through a TUI's coloured input box wherever the
     trailing real cursor sits. render() fills --eh-cell-bg with the row's sampled
     background; the transparent fallback is what a default-background row wants anyway. */
  #term.eh-hide-cursor .xterm-cursor {
    background-color: var(--eh-cell-bg, transparent) !important;
    color: inherit !important;
    outline: none !important;
    box-shadow: none !important;
    border: none !important;
    animation: none !important;
  }
  /* The same hole, punched by xterm's own blink instead of by us. Its injected
     blink_block keyframe fills the OFF beat with `background-color: inherit`, and the
     row div a cursor span inherits from carries no background of its own, so the beat
     resolves to the terminal's background rather than the cell's. Inside a TUI's
     coloured input box that is a one-cell hole flickering once a second, and it is the
     one surface the predicted paint does not cover, because here xterm draws the cursor
     and we do not. (Measured against a band at rgb(48,48,48): the cell alternated the
     cursor's rgb(255,255,255) and rgb(30,30,30), never the band.)
     Same animation, same beats, with the row's sampled background standing in for
     `inherit`. Only the block style needs it: the bar and underline keyframes animate
     box-shadow and border alone and never touch the background. The id out-specifies
     xterm's five-class selector, which carries no !important of its own here. */
  @keyframes eh-blink-block {
    0%  { background-color: var(--eh-cursor-bg); color: var(--eh-cursor-fg); }
    50% { background-color: var(--eh-cell-bg, transparent); color: var(--eh-cursor-bg); }
  }
  #term .xterm-cursor.xterm-cursor-blink.xterm-cursor-block {
    animation: eh-blink-block 1s step-end infinite;
  }
</style>
</head>
<body>
<div id="term"></div>
<div id="login">
  <form id="loginForm">
    <h1>EnvHaven Terminal</h1>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit">Connect</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div id="status" role="status" aria-live="polite">
  <div class="card">
    <div class="mark"><span class="glow"></span><span class="spin" id="statusSpin">⠿</span><span class="lift" id="statusLift" aria-hidden="true"></span></div>
    <div>
      <div class="who" id="statusWho"></div>
      <div class="msg" id="statusMsg"></div>
    </div>
    <button type="button" id="statusBtn">Reconnect</button>
  </div>
</div>
<script src="/__console/assets/xterm.js"></script>
<script src="/__console/assets/addon-fit.js"></script>
<script src="/__console/assets/eh-engine.js"></script>
</body>
</html>
